{% extends 'base.html' %}{% block body %}<div class='panel'><h2>Register</h2>{% if error %}<div class="small warn">{{ error }}</div>{% endif %}<form method='post'><div class='row'><div><label>Email</label><br><input type='email' name='email' required></div><div><label>Password</label><br><input type='password' name='password' required></div><div><label>Organization Name</label><br><input type='text' name='org_name' required></div></div><input type='hidden' name='_csrf' value='{{ csrf_token }}'><p><button class='btn'>Create Account</button></p></form></div>{% endblock %}
