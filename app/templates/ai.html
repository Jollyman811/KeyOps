{% extends 'base.html' %}{% block body %}<div class='panel'><h2>AI Assist</h2><form method='post'><input type='hidden' name='_csrf' value='{{ csrf_token }}'><div class='row'><div><label>Task</label><br><select name='mode'><option value='reply' {% if mode=='reply' %}selected{% endif %}>Draft Email Reply</option><option value='proposal' {% if mode=='proposal' %}selected{% endif %}>Draft Proposal</option></select></div><div><label>Provider</label><br><select name='provider'><option value='openai' {% if provider=='openai' %}selected{% endif %}>OpenAI</option><option value='gemini' {% if provider=='gemini' %}selected{% endif %}>Gemini</option><option value='ollama' {% if provider=='ollama' %}selected{% endif %}>Ollama</option><option value='grok' {% if provider=='grok' %}selected{% endif %}>Grok (xAI)</option></select></div></div><label>Context</label><br><textarea name='context' rows='6' style='width:100%'>{{ context or '' }}</textarea><p><button class='btn'>Generate</button></p></form>{% if output %}<div class='panel'><h3>Output</h3><pre style="white-space:pre-wrap">{{ output }}</pre></div>{% endif %}</div>{% endblock %}
